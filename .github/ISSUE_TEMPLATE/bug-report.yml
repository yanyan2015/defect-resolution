name: Bug report
description: 报告 skill 或取证脚本的问题
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你发现问题。请尽量提供可复现的输入 —— 报错信息、仓库与版本、实际输出与期望输出。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 描述实际观察到的行为
      placeholder: |
        collect.sh 在 XX 仓库上把真修复 commit 排在噪声提交之后
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 完整的命令序列，包括版本号、参数
      render: shell
      placeholder: |
        bash test/run-tests.sh line_drift
        # 或
        bash scripts/collect.sh <repo> v1.0 v2.0 --path src/foo.c --range 80,95
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果是什么
    validations:
      required: true

  - type: textarea
    id: actual-output
    attributes:
      label: 实际输出
      description: 完整的命令输出（请去掉敏感信息）
      render: shell

  - type: input
    id: repo
    attributes:
      label: 相关仓库与版本
      placeholder: "curl/curl @ v8.4.0 → v8.5.0"

  - type: dropdown
    id: component
    attributes:
      label: 出问题的部分
      options:
        - collect.sh（取证 / 候选排序）
        - verify.sh（验证 / bisect）
        - anchor.sh（版本锚点）
        - inspect.sh（候选语义卡片）
        - acquire.sh（仓库获取）
        - extract_symbols.py（符号抽取）
        - SKILL.md（流程说明）
        - 文档（README / DESIGN / references）
        - 不确定
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "git 2.55.0.windows.3, bash 5.3, python 3.14, Windows 11"

  - type: checkboxes
    id: checks
    attributes:
      label: 附加信息
      options:
        - label: 我已确认这不是浅克隆导致的历史不完整
        - label: 我已运行 `bash test/run-tests.sh` 确认现有测试仍通过
