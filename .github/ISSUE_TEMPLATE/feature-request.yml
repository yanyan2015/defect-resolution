name: Feature request
description: 提议新的取证通道、判据或功能
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提议新功能前，请先读 [DESIGN.md](../../blob/main/DESIGN.md) —— 尤其是「核心矛盾」和「已知技术债」两节，
        那里的框架能帮你判断这个想法是否与现有设计一致。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 不是"我想加什么功能"，而是"什么情况下现在的做法不够用"
      placeholder: |
        当修复改的是 Makefile 而不是源码文件时，collect.sh 只能给出权重 1 的弱线索。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
      description: 你认为应该怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它方案
      description: 包括你否决的方案和否决理由

  - type: textarea
    id: evidence-channel
    attributes:
      label: 如果是新增取证通道
      description: |
        请说明：
        1. 它能抓到其它通道抓不到什么（正交性）
        2. 它会漏掉什么（盲区）
        3. 建议的权重，以及为什么

  - type: textarea
    id: test-plan
    attributes:
      label: 如何验证
      description: 构造一个场景：其它通道都会漏，只有新方案能捞出来
